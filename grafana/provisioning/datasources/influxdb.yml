# ════════════════════════════════════════════════════════
#  Grafana Datasource — InfluxDB 2.x (Flux)
#  Auto-provisioned เมื่อ Grafana เริ่มต้น
#  ไม่ต้องตั้งค่า datasource ด้วยมือใน UI
# ════════════════════════════════════════════════════════

apiVersion: 1

datasources:
  - name: InfluxDB
    type: influxdb
    uid: influxdb-iot
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: ${INFLUXDB_ORG}
      defaultBucket: ${INFLUXDB_BUCKET}
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUXDB_TOKEN}
    editable: false
