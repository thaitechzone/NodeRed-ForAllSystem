# ════════════════════════════════════════════════════════════════════════════════
# Node-RED + N8N + MQTT + ngrok + Ollama + PostgreSQL Stack
#
# ตัวแปรที่ต้องใน .env file:
#   - TZ                    (Timezone)
#   - NGROK_AUTHTOKEN       (ngrok authentication token)
#   - NGROK_DOMAIN          (ngrok static domain, ไม่มี https://)
#   - NGROK_URL             (ngrok URL for N8N/ngrok CLI, มี https://)
#   - N8N_ENCRYPTION_KEY    (N8N encryption key - 32 char hex)
#   - POSTGRES_USER         (PostgreSQL username)
#   - POSTGRES_PASSWORD     (PostgreSQL password)
#   - POSTGRES_DB           (PostgreSQL database name)
#
# หมายเหตุ: Docker Compose จะอ่าน .env file โดยอัตโนมัติจาก directory เดียวกัน
# ════════════════════════════════════════════════════════════════════════════════

services:

  # ════════════════════════════════════════════════════════
  #  Mosquitto — Local MQTT Broker
  #  MQTT  : localhost:1883
  #  WS    : localhost:9001
  # ════════════════════════════════════════════════════════
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped
    networks:
      - iot_network
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ════════════════════════════════════════════════════════
  #  PostgreSQL — Relational Database
  #  Port  : localhost:5432
  #  เชื่อมจาก container อื่น: host=postgres port=5432
  #  Init scripts: ./postgres/init/*.sql (รันครั้งแรกอัตโนมัติ)
  # ════════════════════════════════════════════════════════
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=${TZ}
    restart: unless-stopped
    networks:
      - iot_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════
  #  Node-RED — Flow-based automation
  #  UI : http://localhost:1880 (ไม่ต้อง login)
  # ════════════════════════════════════════════════════════
  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
      - ./nodered/settings.js:/data/settings.js
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - iot_network

  # ════════════════════════════════════════════════════════
  #  N8N — Workflow Automation
  #  UI : http://localhost:5678
  #  ใช้ PostgreSQL เป็น backend database
  # ════════════════════════════════════════════════════════
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - TZ=${TZ}
      - GENERIC_TIMEZONE=${TZ}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=${NGROK_URL}/
      - N8N_EDITOR_BASE_URL=${NGROK_URL}/
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_METRICS=false
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      # PostgreSQL backend
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - iot_network

  # ════════════════════════════════════════════════════════
  #  Ollama — Local LLM Runtime (GPU)
  #  API  : http://localhost:11434
  #  เรียก model: docker exec -it ollama ollama pull llama3.2:3b
  # ════════════════════════════════════════════════════════
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - iot_network

  # ════════════════════════════════════════════════════════
  #  Ngrok — Tunnel N8N to the internet
  #  Dashboard : http://localhost:4040
  # ════════════════════════════════════════════════════════
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    command: http n8n:5678 --url=${NGROK_URL}
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - n8n
    restart: unless-stopped
    networks:
      - iot_network

# ════════════════════════════════════════════════════════
#  Networks & Volumes
# ════════════════════════════════════════════════════════
networks:
  iot_network:
    driver: bridge

volumes:
  nodered_data:
  n8n_data:
  mosquitto_data:
  mosquitto_log:
  ollama_data:
  postgres_data:
