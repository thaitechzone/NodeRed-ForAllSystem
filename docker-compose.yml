version: '3.8'

services:

  # ════════════════════════════════════════════════════════
  #  InfluxDB — Time-Series Database (เก็บข้อมูล sensor)
  #  UI / API : localhost:8086
  # ════════════════════════════════════════════════════════
  influxdb:
    image: influxdb:2
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USERNAME}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
    restart: unless-stopped
    networks:
      - iot_network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ════════════════════════════════════════════════════════
  #  Grafana — Dashboard & Visualization
  #  UI : localhost:3000
  # ════════════════════════════════════════════════════════
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - TZ=${TZ}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - iot_network

  # ════════════════════════════════════════════════════════
  #  Mosquitto — Local MQTT Broker
  #  MQTT  : localhost:1883
  #  WS    : localhost:9001
  # ════════════════════════════════════════════════════════
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped
    networks:
      - iot_network
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ════════════════════════════════════════════════════════
  #  Node-RED — OPC-UA Reader + MQTT Publisher
  #  UI : http://localhost:1880
  # ════════════════════════════════════════════════════════
  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
      - ./nodered/settings.js:/data/settings.js:ro
    environment:
      - TZ=${TZ}
      - OPC_SERVER_IP=${OPC_SERVER_IP}
      - OPC_SERVER_PORT=${OPC_SERVER_PORT}
      - NR_ADMIN_USERNAME=${NR_ADMIN_USERNAME}
      - NR_ADMIN_PASSWORD_HASH=${NR_ADMIN_PASSWORD_HASH}
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    networks:
      - iot_network

  # ════════════════════════════════════════════════════════
  #  N8N — Workflow Automation
  #  UI : http://localhost:5678
  # ════════════════════════════════════════════════════════
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - TZ=${TZ}
      - GENERIC_TIMEZONE=${TZ}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=${NGROK_URL}/
      - N8N_EDITOR_BASE_URL=${NGROK_URL}/
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_METRICS=false
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    networks:
      - iot_network


  # ════════════════════════════════════════════════════════
  #  Ngrok — Tunnel N8N to the internet
  #  Dashboard : http://localhost:4040
  # ════════════════════════════════════════════════════════
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    command: http --domain=${NGROK_DOMAIN} n8n:5678
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - n8n
    restart: unless-stopped
    networks:
      - iot_network

# ════════════════════════════════════════════════════════
#  Networks & Volumes
# ════════════════════════════════════════════════════════
networks:
  iot_network:
    driver: bridge

volumes:
  nodered_data:
  n8n_data:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
  grafana_data:
